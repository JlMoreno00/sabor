[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sabor-mcp"
dynamic = ["version"]
description = "Recipes, meal plans and shopping lists with SQLite by default; Mealie and Postgres optional."
authors = [{ name = "JlMoreno00" }]
keywords = ["mcp", "recipes", "meal-planning", "shopping-list", "sqlite", "model-context-protocol", "mealie", "postgres", "meal-plan", "cooking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "mcp[cli]==1.26.0",
    "requests>=2.31.0",
    "urllib3>=2.2",
    "recipe-scrapers>=15.0.0",
    "yt-dlp>=2024.0.0",
    "python-bring-api>=3.0.0",
    "keyring>=25",
]

[project.urls]
Homepage = "https://github.com/JlMoreno00/sabor"
Repository = "https://github.com/JlMoreno00/sabor"
Issues = "https://github.com/JlMoreno00/sabor/issues"
Author = "https://github.com/JlMoreno00"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# Optional local transcription (#102): runs on the CPU, no AI provider is called.
# av stays below 16: faster-whisper 1.2.1 uses an av.open() argument that PyAV 19 removed.
transcribe = ["faster-whisper==1.2.1", "av>=11,<16"]

[project.scripts]
sabor-mcp = "sabor.server:cli"

[tool.hatch.version]
path = "sabor/server.py"
pattern = 'VERSION = "(?P<version>[^\"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["sabor", "nutrition"]

[tool.hatch.build.targets.wheel.force-include]
"sabor_mcp.py" = "sabor_mcp.py"
"catalog" = "sabor/_catalog"

[tool.hatch.build.targets.sdist]
include = ["sabor", "nutrition", "sabor_mcp.py", "catalog", "LICENSE", "README.md", "pyproject.toml"]

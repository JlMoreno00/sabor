# yamllint disable rule:line-length
# Never runs on PRs; first publication needs the maintainer's explicit OK.
# Manual runs upload to TestPyPI unless pypi is chosen; version tags upload to PyPI.
name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index (TestPyPI unless pypi is chosen explicitly)
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'pypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Build distributions
        run: uv build

      - name: Verify tag matches built version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import glob
          import os
          import zipfile
          from email.parser import BytesParser

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
              version = BytesParser().parsebytes(wheel.read(metadata))["Version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Tag does not match built version"
          PY

      - name: Publish to the selected index
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ (inputs.target || 'pypi') == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

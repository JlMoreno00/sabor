# yamllint disable rule:line-length
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so a ruff release cannot turn CI red without a code change.
      # Rules and exclusions live in ruff.toml.
      - name: Install ruff
        run: python -m pip install ruff==0.17.1

      - name: Run ruff
        run: ruff check --output-format=github .

  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # `python -m pytest` puts the repository root on sys.path, which the
      # offline suite needs to import `sabor`, `nutrition`, `scripts` and
      # `tests`.
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Smoke test installed wheel (stdio, no Mealie)
        run: python scripts/smoke_stdio.py dist/*.whl

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # One-command install contract (#33): needs only the Compose CLI.
      - name: Check compose configuration
        run: python3 scripts/check-compose.py

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sabor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start standalone container and wait for health
        run: |
          docker run -d --name sabor-smoke -p 127.0.0.1:9170:8080 -v sabor-data:/data sabor:ci
          for attempt in $(seq 1 60); do
            echo "Healthcheck attempt $attempt"
            status=$(docker inspect --format '{{.State.Health.Status}}' sabor-smoke)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 2
          done
          docker logs sabor-smoke
          exit 1

      - name: Smoke test HTTP (no Mealie)
        run: |
          python3 -m pip install 'mcp==1.26.0'
          python3 scripts/smoke_http.py http://127.0.0.1:9170/mcp

      - name: Stop smoke container
        if: always()
        run: |
          docker logs sabor-smoke || true
          docker rm -f sabor-smoke || true
